<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>맛집 검색 및 추천 프로그램</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Pretendard", "Noto Sans KR", Arial, sans-serif;
      }

      body {
        margin: 0;
        padding: 24px;
        background: #f4f6fb;
        color: #1f2937;
      }

      .app {
        max-width: 960px;
        margin: 0 auto;
        background: #ffffff;
        border-radius: 16px;
        box-shadow: 0 12px 30px rgba(17, 24, 39, 0.08);
        padding: 24px;
      }

      h1 {
        margin-top: 0;
        margin-bottom: 8px;
      }

      .description {
        color: #4b5563;
        margin-top: 0;
        margin-bottom: 24px;
      }

      .controls {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 12px;
        margin-bottom: 16px;
      }

      input,
      select,
      button {
        padding: 10px 12px;
        border: 1px solid #d1d5db;
        border-radius: 10px;
        font-size: 14px;
      }

      button {
        background: #2563eb;
        color: #fff;
        border: none;
        cursor: pointer;
        font-weight: 600;
      }

      button:hover {
        background: #1d4ed8;
      }

      .results-info {
        margin: 8px 0 16px;
        color: #374151;
      }

      .restaurant-grid {
        list-style: none;
        padding: 0;
        margin: 0;
        display: grid;
        gap: 12px;
      }

      .card {
        border: 1px solid #e5e7eb;
        border-radius: 12px;
        padding: 14px;
        background: #fafafa;
      }

      .card h3 {
        margin: 0 0 8px;
      }

      .meta {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        font-size: 13px;
        color: #374151;
      }

      .badge {
        background: #e0e7ff;
        color: #3730a3;
        border-radius: 999px;
        padding: 2px 10px;
        font-size: 12px;
      }

      .empty {
        text-align: center;
        color: #6b7280;
        padding: 24px;
        border: 1px dashed #d1d5db;
        border-radius: 12px;
      }
    </style>
  </head>
  <body>
    <main class="app">
      <h1>맛집 검색 및 추천 프로그램 🍽️</h1>
      <p class="description">
        지역/음식 종류/최소 평점을 기준으로 맛집을 검색하고, 랜덤 추천도 받을 수 있습니다.
      </p>

      <section class="controls" aria-label="검색 조건">
        <input id="keyword" type="text" placeholder="식당명 또는 메뉴 키워드" />
        <select id="region">
          <option value="all">전체 지역</option>
          <option value="강남">강남</option>
          <option value="홍대">홍대</option>
          <option value="을지로">을지로</option>
          <option value="성수">성수</option>
          <option value="잠실">잠실</option>
        </select>
        <select id="category">
          <option value="all">전체 종류</option>
          <option value="한식">한식</option>
          <option value="일식">일식</option>
          <option value="양식">양식</option>
          <option value="중식">중식</option>
          <option value="디저트">디저트</option>
        </select>
        <select id="minRating">
          <option value="0">최소 평점 0.0</option>
          <option value="4.0">최소 평점 4.0</option>
          <option value="4.3">최소 평점 4.3</option>
          <option value="4.5">최소 평점 4.5</option>
          <option value="4.7">최소 평점 4.7</option>
        </select>
        <button id="searchButton" type="button">검색</button>
        <button id="recommendButton" type="button">랜덤 추천</button>
      </section>

      <p id="resultsInfo" class="results-info"></p>
      <ul id="restaurantList" class="restaurant-grid" aria-live="polite"></ul>
    </main>

    <script src="index.js"></script>
  </body>
</html>
